name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: write

# Cancel superseded runs on PRs (never on tag pushes, which drive releases).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '10.14.0'
  # The @opencode-ai/plugin devDependency is pinned to the opencode release
  # the plugin is verified against. Matches package.json.
  OPENCODE_VERSION: '1.18.30'

jobs:
  ci:
    name: Lint, Type-check and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full local gate: format:check, lint, typecheck, and unit tests.
      - run: pnpm check

  # A containerized lane that runs the entire quality gate — format, lint,
  # type-check, and unit tests — through the repo's multi-stage Dockerfile
  # (its default `ci-output` collector). Docker can only build a Linux
  # container, so this guards the reproducible, host-tool-free CI path
  # documented in DEVELOPMENT.md ("Running Checks in Docker") and exercises
  # every Dockerfile stage end to end.
  docker:
    name: CI Gate (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build CI gate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ci-output
          outputs: type=local,dest=./ci-output
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Containerized e2e suite: a real opencode (pinned via OPENCODE_VERSION)
  # runs inside a testcontainers-managed container with a fake model server;
  # the test asserts the config-hook registration reaches the model request.
  # Docker is available on the ubuntu runners by default.
  e2e:
    # The `env` context is not available in job names; the version under
    # test is still pinned in the workflow-level `env` above (and printed by
    # the test itself).
    name: E2E (Docker, opencode)
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run e2e tests (testcontainers)
        run: pnpm test:e2e
        env:
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}

  # Publishes to npm (tokenless via OIDC Trusted Publishers) and creates a
  # GitHub release. Only runs on version tags after all CI gates pass.
  #
  # npm Trusted Publisher setup: on npmjs.com, link the package to
  #   repository = ameshkov/opencode-agent-plugins, workflow filename = ci.yml
  release:
    name: Publish & GitHub Release
    needs:
      - ci
      - docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release
      id-token: write # to enable npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:   $TAG"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No token needed: npm authenticates via OIDC (Trusted Publishers).
      # Provenance is generated automatically from the id-token permission.
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Build npm package tarball
        run: pnpm pack
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: See [CHANGELOG.md](./CHANGELOG.md) for the list of
            changes.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: opencode-agent-plugins-*.tgz
